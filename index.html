const SCENE=`<svg class="pic" viewBox="0 0 300 200" role="img" aria-label="A woman at home looking out of the window at dark clouds"><rect width="300" height="200" fill="#F7EBD8"/><rect x="150" y="24" width="120" height="110" rx="6" fill="#5B6B80" stroke="#101828" stroke-width="5"/><path d="M210 24v110M150 79h120" stroke="#101828" stroke-width="4"/><g fill="#2D3748"><circle cx="175" cy="52" r="14"/><circle cx="194" cy="46" r="16"/><circle cx="188" cy="60" r="14"/><circle cx="235" cy="100" r="15"/><circle cx="252" cy="94" r="12"/><circle cx="244" cy="108" r="14"/></g><path d="M170 72l-6 14M188 76l-6 14M240 120l-6 12" stroke="#4DA3FF" stroke-width="3" stroke-linecap="round"/><circle cx="88" cy="70" r="20" fill="#FFD9B0" stroke="#101828" stroke-width="4"/><path d="M68 66a20 20 0 0 1 40 0c-8 6-30 6-40 0z" fill="#6B3E26"/><path d="M62 190v-70c0-18 52-18 52 0v70z" fill="#FF7E6B" stroke="#101828" stroke-width="4" stroke-linejoin="round"/><path d="M110 134l30-26" stroke="#FFD9B0" stroke-width="10" stroke-linecap="round"/><rect x="10" y="150" width="80" height="40" rx="6" fill="#B8935A" stroke="#101828" stroke-width="4"/></svg>`;
const N=a=>a.map(t=>({t}));
const EID=[['Muna','Did you enjoy Eid, Samira?'],['Samira','Yes, thanks, Muna. We went to my aunt’s house for dinner. She gave me this soap.'],['Muna','That smells nice. What about your parents? Did they give you anything?'],['Samira','My mum wanted to buy clothes for me. She chose this sweater.'],['Muna','That’s nice. What about your dad?'],['Samira','Well, you know I’m crazy about science …'],['Muna','Yes, I know!'],['Samira','He bought me these books, about animals and space and other interesting things.'],['Muna','They look good …'],['Samira','Yes ... but my favourite present was from my uncle.'],['Muna','What was it?'],['Samira','This camera. It’s fantastic!'],['Muna','You’re lucky! I’d love to have a camera like that. And how about your brother and sister?'],['Samira','Look, I’m wearing their presents! This belt is from my brother.'],['Muna','It’s the same as mine!'],['Samira','Yes, it is. And my sister gave me this bracelet.'],['Muna','You got some good presents!']];
const PR=['A belt','B umbrella','C soap','D books','E bracelet','F sweater','G rucksack','H camera'];
const pr4=(ans,others)=>{const o=[ans,...others];const k=PR.indexOf(ans)%4;const r=[...o.slice(k),...o.slice(0,k)];return N(r)};
const D1=[['Girl','I heard you’re going to Shinas, Safiya. You’re so lucky!'],['Safiya','I know! I’ll only be there for three days, but I’m really excited.'],['Girl','It’s too bad you can’t stay longer. But I know you’ll love it.']];
const D2=[['Saif','Oh, no! Not again!'],['Woman','What’s wrong? Have you forgotten your flip-flops, Saif?'],['Saif','No, I’ve got my flip-flops. But I left my washbag at home. This always happens when I pack too quickly.'],['Woman','Oh, that happens to me, too. What did you have in it? Soap and a toothbrush?'],['Saif','No, I had some medicines in the washbag, too. I’ll have to look for a pharmacy.']];
const D3=[['Sara','I can’t wait for the summer holidays. It’s going to be so much fun!'],['Boy','Oh? Are you going somewhere special this year?'],['Sara','Yes. To my Aunt Zainab’s beach house, and I always have a great time.'],['Boy','Are you going to be there the whole summer, or only for part of the summer?'],['Sara','Just for the month of June, when the weather’s really warm and sunny.'],['Boy','You’re so lucky. I’d love to go there!']];
const D4=[['Woman','Come on, Faris. You’re going to miss the bus.'],['Faris','OK, Mum. I’m ready. What time does the bus leave?'],['Woman','At two o’clock. And you’ll arrive in Muscat at half past four.'],['Faris','And will Grandma be waiting for me at the station?'],['Woman','No, your uncle Hassan will pick you up and take you to Grandma’s.']];
const D5=[['Man','Well, we have to decide where to go on holiday this summer.'],['Woman','I know where I want to go ... New York! But that’s too expensive.'],['Man','Yes, it is! And what about Paris? You can practise your French.'],['Woman','That’s true. Or we could go to Greece. It’s quite cheap and Athens is beautiful.'],['Man','Yes, but if we go to Paris we could stay at your cousins’ flat.'],['Woman','You’re right. And we haven’t seen them for a long time. Let’s do that.']];

A[1].q.forEach((q,i)=>{q.a=q.o.findIndex(x=>x.t===['C soap','F sweater','D books','H camera','A belt','E bracelet'][i])});

const nst=()=>({i:0,pk:null,sc:0,done:false,res:{},sh:false});
let S={step:0,st:A.map(nst),rev:null};
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function playL(L){try{speechSynthesis.cancel();L.forEach(l=>{const u=new SpeechSynthesisUtterance(l[1]);u.lang='en-GB';u.rate=.9;u.pitch=l[0]===L[0][0]?1.35:.85;speechSynthesis.speak(u)})}catch(e){}}
const GOOD=()=>tone([523,659,784,1047],.1,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');

function cur(){const a=A[S.step];return S.rev?S.rev.list[S.rev.i]:{a,s:S.st[S.step],q:a.q[S.st[S.step].i]}}
function lines(){const a=A[S.step];if(S.rev){const r=S.rev.list[S.rev.i];playL(r.q.lines||r.a.lines);return}const s=S.st[S.step],q=a.q[s.i];playL(q.lines||a.lines)}
function scr(){S.st[S.step].sh=!S.st[S.step].sh;render()}
function pick(i){if(S.rev){const r=S.rev;if(r.pk!==null)return;r.pk=i;r.q=r.list[r.i].q;(i===r.q.a)?GOOD():BAD();render();return}const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;const ok=i===q.a;s.res[s.i]=ok;if(ok){s.sc++;GOOD()}else BAD();render()}
function nxt(){if(S.rev){const r=S.rev;if(r.pk===null)return;if(r.i+1<r.list.length){r.i++;r.pk=null}else{r.done=true;tone([523,659,784,1047],.14,'triangle')}render();return}const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}

function missed(){const L=[];A.slice(0,RS).forEach((a,k)=>a.q.forEach((q,i)=>{if(S.st[k].res[i]===false)L.push({a,q,k})}));return L}

function total(){return S.st.slice(0,RS).reduce((x,y)=>x+y.sc,0)}
function stars(){return total()}
function sec(k){const a=A[k],s=S.st[k];return {n:a.n,m:s.sc,t:a.q.length,d:Object.keys(s.res).length}}
function qcard(a,q,s,lk,pkv,n,i,rev){
 const ok=lk&&pkv===q.a;
 const au=(q.lines||a.lines)?'<div class="row" style="justify-content:flex-start"><button class="go alt" style="padding:8px 24px;font-size:18px" onclick="lines()">▶ Play the audio</button>'+(rev?'':'<button class="go" style="padding:8px 24px;font-size:18px" onclick="scr()">'+(s.sh?'Hide':'Show')+' the script</button>')+'</div>'+((!rev&&s.sh)?'<div class="scr">'+(q.lines||a.lines).map(l=>'<b>'+l[0]+':</b> '+l[1]).join('<br>')+'</div>':''):'';
 const ht=q.html?(q.html==='SCENE'?SCENE:q.html):'';
 return (a.info&&!rev?'<div class="learn">'+a.info+'</div>':'')+au+ht+'<div class="q">'+q.pr+'</div><div class="grid">'+q.o.map((o,j)=>'<button class="o'+(lk&&j===q.a?' ok':lk&&j===pkv?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+j+')"><span>'+o.t+'</span></button>').join('')+'</div><div class="fb">'+(lk?'<span class="seal'+(ok?'':' no')+'">'+(ok?'CLEARED':'RECHECK')+'</span><span>The answer is: '+q.o[q.a].t+'. '+(q.ex||'')+'</span>':'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(i+1===n?'Finish':'Next →')+'</button>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(S.rev){const r=S.rev;if(r.done)return '<div class="card"><h2>Reinforcement complete</h2><div class="big-stamp">CLEARED</div><div class="fb" style="justify-content:center">You practised all your missed questions. Well done!</div><div class="row"><button class="go alt" onclick="endRev()">Back to my results</button></div></div>';const it=r.list[r.i];return '<div class="card"><div class="meta"><span>Reinforcement · '+it.a.n+'</span><span class="mono">'+(r.i+1)+' / '+r.list.length+'</span></div>'+qcard(it.a,it.q,s,r.pk!==null,r.pk,r.list.length,r.i,true)+'</div>'}
 if(a.type==='mc'){const q=a.q[s.i],n=a.q.length;
  if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="big-stamp">'+s.sc+' / '+n+'</div><div class="fb" style="justify-content:center">'+(s.sc===n?'Perfect! Cleared for take-off!':s.sc>=n-1?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button><button class="go" onclick="go('+(S.step+1)+')">Next gate →</button></div></div>';
  return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span class="mono">Q '+(s.i+1)+'/'+n+' · MILES '+s.sc+'</span></div>'+qcard(a,q,s,s.pk!==null,s.pk,n,s.i,false)+'</div>'}
 const t=total(),gr=GR.find(g=>t>=g[0]),M=missed(),rows=A.slice(0,RS).map((x,k)=>sec(k)),weak=rows.filter(r=>r.d>0&&r.m<r.t).map(r=>r.n.replace(/^\d · /,''));
 const done=rows.reduce((x,r)=>x+r.d,0);
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span class="mono">FINAL BOARDING</span></div><div class="big-stamp" style="font-size:clamp(46px,8vw,84px)">'+t+' / 20</div><div class="fb" style="justify-content:center;text-align:center">Grade: <b style="font-family:monospace;font-size:1.3em">'+gr[1]+'</b> · '+gr[2]+'</div>'+(done<20?'<div class="learn">You answered '+done+' of 20 questions. Go back to the parts you have not finished to improve your mark!</div>':'')+'<div class="rs">'+rows.map(r=>'<div>'+r.n+'<br><b>'+r.m+' / '+r.t+'</b></div>').join('')+'</div>'+(weak.length?'<div class="learn"><b>Feedback:</b> Practise again: '+weak.join(', ')+'.</div>':(done===20?'<div class="learn"><b>Feedback:</b> Perfect in every part. Congratulations on finishing Unit 3!</div>':''))+(M.length?'<div class="miss"><b>My missed questions (with the correct answers):</b><br>'+M.map(m=>'• '+m.q.pr.replace(/<[^>]+>/g,'')+' → <b>'+m.q.o[m.q.a].t+'</b>').join('<br>')+'</div><div class="row"><button class="go alt" onclick="startRev()">Practise my missed questions</button></div>':'')+'<div class="row"><button class="go" onclick="go(0)">Start again from Gate 1</button></div><div class="credit" style="color:#101828">Created by T.Badria Alfalahi</div></div>'}
function render(){
 const L=A.length-1;
 document.getElementById('nav').innerHTML='<span>Choose your gate:</span>'+A.map((a,k)=>'<button class="'+(k===S.step?'on':'')+'" onclick="go('+k+')">'+a.n+'</button>').join('');
 document.getElementById('stars').textContent=stars()+' / 20';
 document.getElementById('pl').style.left='calc('+(S.step/L*100)+'% - '+(S.step/L*56)+'px)';
 document.getElementById('stations').innerHTML=A.map((a,k)=>'<span class="st'+(k<=S.step?' on':'')+'" style="left:'+(k/L*100)+'%">'+(k+1)+'</span>').join('');
 document.getElementById('main').innerHTML=view()}
render();
</script></body></html>
